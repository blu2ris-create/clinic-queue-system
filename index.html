<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام نداء المراجعين - مركز صحي الصالحية للرعاية الأولية</title>

        body { background-color: #0b0f19; color: white; font-family: 'Cairo', sans-serif; height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; }

        .middle-header { text-align: center; margin-top: 5px; }

        .display-number { font-size: 6.5rem; font-weight: bold; color: #ffc107; margin-bottom: 10px; line-height: 1.1; word-break: break-all; }
        .display-text { font-size: 2.2rem; color: #e2e8f0; font-weight: bold; }

        .form-label { color: #38bdf8; font-weight: bold; margin-bottom: 8px; display: block; text-align: right; }

        .btn-call:hover { background-color: #e0a800; }

        .admin-gear-btn:hover { color: #ffc107; border-color: #ffc107; transform: rotate(90deg); }
