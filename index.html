<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام نداء المراجعين - مركز صحي الصالحية للرعاية الأولية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #0b0f19; color: white; height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        #roleSelector { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0b0f19; z-index: 10000; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .mode-card { background: #151c2c; border: 2px solid #2a344d; border-radius: 20px; padding: 30px; text-align: center; max-width: 480px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .btn-mode { font-size: 1.1rem; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; margin-bottom: 15px; background: #ffc107; color: #0b0f19; border: none; cursor: pointer; transition: 0.3s; }
        .btn-mode.alt { background: transparent; border: 2px solid #38bdf8; color: #38bdf8; }
        .btn-mode:hover { opacity: 0.9; transform: scale(1.02); }

        #displayOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(7, 10, 17, 0.95); z-index: 9999; display: none; justify-content: center; align-items: center; flex-direction: column; padding: 15px; }
        .activate-box { background: #151c2c; border: 2px solid #334155; padding: 40px; border-radius: 20px; text-align: center; max-width: 500px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .btn-activate { background: #ffc107; color: #0b0f19; border: none; font-weight: bold; font-size: 1.2rem; padding: 15px 30px; border-radius: 50px; cursor: pointer; margin-top: 20px; }

        #displayScreen { display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; background-color: #0b0f19; z-index: 10; padding: 15px 25px; flex-direction: column; justify-content: space-between; overflow: hidden; }
        .top-header { display: flex; justify-content: flex-end; align-items: center; width: 100%; padding-bottom: 8px; border-bottom: 2px solid #1e293b; }
        .cluster-logo { height: 90px; width: auto; object-fit: contain; }

        .content-grid { display: grid; grid-template-columns: 550px 1fr; gap: 20px; height: calc(100vh - 120px); align-items: center; padding-top: 10px; }
        .sidebar-wrapper { display: flex; flex-direction: column; height: 95%; justify-content: flex-start; }
        .live-date-banner { text-align: center; color: #38bdf8; font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; background: #111827; border: 1px solid #1f2937; padding: 10px; border-radius: 12px; }
        .sidebar { background-color: #111827; border: 1px solid #1f2937; border-radius: 20px; padding: 15px; display: flex; flex-direction: column; height: calc(100% - 45px); overflow: hidden; }
        .archive-title { color: #ffc107; text-align: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #374151; font-weight: bold; font-size: 1.2rem; }
        .table-container { flex-grow: 1; overflow-y: auto; }
        .custom-table { width: 100%; color: white; text-align: center; border-collapse: collapse; }
        .custom-table th { background-color: #1f2937; color: #38bdf8; padding: 12px; font-size: 1.1rem; position: sticky; top: 0; }
        .custom-table td { background-color: #151c2c; padding: 14px; border-bottom: 1px solid #1f2937; font-size: 1.1rem; }

        .main-area { background: #111827; border: 1px solid #1f2937; border-radius: 20px; padding: 20px; height: 95%; display: flex; flex-direction: column; justify-content: space-around; align-items: center; }
        .middle-header { text-align: center; }
        .middle-header .main-title { font-size: 2.6rem; font-weight: bold; color: #ffffff; }
        .middle-header .sub-title { font-size: 1.3rem; color: #38bdf8; font-weight: bold; }
        .display-box { background: #151c2c; border: 2px solid #334155; border-radius: 25px; padding: 30px; text-align: center; width: 100%; max-width: 750px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .display-number { font-size: 6rem; font-weight: bold; color: #ffc107; margin-bottom: 10px; line-height: 1; }
        .display-text { font-size: 2rem; color: #e2e8f0; font-weight: bold; }

        #controlScreen { display: none; width: 100%; max-width: 500px; background: #151c2c; border: 2px solid #2a344d; border-radius: 20px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); position: relative; margin: auto; }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-label { color: #38bdf8; font-weight: bold; margin-bottom: 6px; display: block; font-size: 1.05rem; }
        .form-control, .form-select { background-color: #0b0f19; border: 1px solid #334155; color: white; padding: 12px; border-radius: 10px; width: 100%; text-align: center; font-size: 1.1rem; outline: none; }
        .form-control:focus, .form-select:focus { border-color: #ffc107; }
        .btn-call { background-color: #ffc107; border: none; color: #0b0f19; font-weight: bold; padding: 14px; font-size: 1.2rem; border-radius: 10px; width: 100%; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-call:hover { background-color: #e0a800; }
        
        .admin-gear-btn { position: absolute; top: 15px; left: 15px; background: #1e293b; border: 1px solid #334155; width: 40px; height: 40px; border-radius: 50%; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #94a3b8; }
        .admin-gear-btn:hover { color: #ffc107; border-color: #ffc107; }
        
        #adminPanel { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #334155; background: #0f172a; padding: 12px; border-radius: 10px; }
        .clinics-scroll-box { max-height: 150px; overflow-y: auto; border: 1px solid #334155; padding: 8px; border-radius: 8px; background: #0b0f19; margin-top: 5px; }
        .clinic-tag { display: flex; align-items: center; background: #1e293b; border: 1px solid #334155; padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 0.85rem; justify-content: space-between; }
        .clinic-tag button { background: none; border: none; color: #ef4444; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .success-alert { background-color: #065f46; color: #34d399; text-align: center; padding: 10px; border-radius: 8px; font-weight: bold; margin-top: 10px; display: none; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- اختيار الدور -->
    <div id="roleSelector">
        <div class="mode-card">
            <h3 style="color: #ffc107; margin-bottom: 8px;">مركز صحي الصالحية للرعاية الأولية</h3>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px;">نظام إدارة النداء الآلي والطوابير</p>
            <button class="btn-mode" onclick="startMode('display')">🖥️ فتح كشاشة عرض رئيسية</button>
            <button class="btn-mode alt" onclick="startMode('control')">📱 فتح كلوحة تحكم (جوال/كمبيوتر)</button>
        </div>
    </div>

    <!-- تفعيل الشاشة -->
    <div id="displayOverlay">
        <div class="activate-box">
            <h2 style="color: #ffc107; margin-bottom: 10px;">شاشة عرض نداء المراجعين</h2>
            <p style="color: #cbd5e1; font-size: 0.95rem;">اضغط على الزر أدناه لبدء الشاشة وتفعيل التنبيهات الصوتية</p>
            <button class="btn-activate" onclick="activateDisplayScreen()">تفعيل الشاشة وبدء النظام 🔊</button>
        </div>
    </div>
