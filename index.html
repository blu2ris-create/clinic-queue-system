<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام نداء المراجعين - مركز صحي الصالحية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #0b0f19; color: white; height: 100vh; width: 100vw; overflow: hidden; }
        
        #roleSelector { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0b0f19; z-index: 99999; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .mode-card { background: #151c2c; border: 2px solid #2a344d; border-radius: 20px; padding: 30px; text-align: center; max-width: 480px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .btn-mode { font-size: 1.1rem; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; margin-bottom: 15px; background: #ffc107; color: #0b0f19; border: none; cursor: pointer; }
        .btn-mode.alt { background: transparent; border: 2px solid #38bdf8; color: #38bdf8; }

        #displayOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(7, 10, 17, 0.98); z-index: 99998; display: none; justify-content: center; align-items: center; flex-direction: column; }
        .activate-box { background: #151c2c; border: 2px solid #334155; padding: 40px; border-radius: 20px; text-align: center; max-width: 480px; width: 90%; }
        .btn-activate { background: #ffc107; color: #0b0f19; border: none; font-weight: bold; font-size: 1.2rem; padding: 15px 30px; border-radius: 50px; cursor: pointer; margin-top: 20px; }

        #displayScreen { display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; background-color: #0b0f19; z-index: 10; padding: 20px; flex-direction: column; justify-content: space-between; }
        .top-header { display: flex; justify-content: flex-end; align-items: center; width: 100%; border-bottom: 2px solid #1e293b; padding-bottom: 10px; }
        .cluster-logo { height: 80px; width: auto; object-fit: contain; }
        .content-grid { display: grid; grid-template-columns: 500px 1fr; gap: 20px; height: calc(100vh - 110px); align-items: center; }
        .sidebar { background-color: #111827; border: 1px solid #1f2937; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; height: 90%; }
        .archive-title { color: #ffc107; text-align: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #374151; font-weight: bold; }
        .table-container { flex-grow: 1; overflow-y: auto; }
        .custom-table { width: 100%; color: white; text-align: center; border-collapse: collapse; }
        .custom-table th { background-color: #1f2937; color: #38bdf8; padding: 10px; position: sticky; top: 0; }
        .custom-table td { background-color: #151c2c; padding: 12px; border-bottom: 1px solid #1f2937; }
        .main-area { background: #111827; border: 1px solid #1f2937; border-radius: 15px; padding: 20px; height: 90%; display: flex; flex-direction: column; justify-content: space-around; align-items: center; text-align: center; }
        .display-box { background: #151c2c; border: 2px solid #334155; border-radius: 20px; padding: 30px; width: 100%; max-width: 700px; }
        .display-number { font-size: 6rem; font-weight: bold; color: #ffc107; line-height: 1; margin-bottom: 10px; }
        .display-text { font-size: 2rem; color: #e2e8f0; font-weight: bold; }

        #controlScreen { display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; background-color: #0b0f19; z-index: 20; padding: 20px; overflow-y: auto; justify-content: center; align-items: center; }
        .control-card { background: #151c2c; border: 2px solid #2a344d; border-radius: 20px; padding: 30px; max-width: 500px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.6); position: relative; margin: auto; }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-label { color: #38bdf8; font-weight: bold; margin-bottom: 6px; display: block; }
        .form-control, .form-select { background-color: #0b0f19; border: 1px solid #334155; color: white; padding: 12px; border-radius: 10px; width: 100%; text-align: center; font-size: 1.1rem; outline: none; }
        .btn-call { background-color: #ffc107; border: none; color: #0b0f19; font-weight: bold; padding: 14px; font-size: 1.2rem; border-radius: 10px; width: 100%; cursor: pointer; margin-top: 10px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- شاشة اختيار الدور -->
    <div id="roleSelector">
        <div class="mode-card">
            <h3 style="color: #ffc107; margin-bottom: 5px;">مركز صحي الصالحية</h3>
            <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 25px;">نظام إدارة النداء الآلي والطوابير</p>
            <button id="btnDisplay" class="btn-mode">🖥️ شاشة عرض رئيسية</button>
            <button id="btnControl" class="btn-mode alt">📱 لوحة تحكم (جوال/كمبيوتر)</button>
        </div>
    </div>

    <!-- نافذة تفعيل الشاشة الصوتية -->
    <div id="displayOverlay">
        <div class="activate-box">
            <h2 style="color: #ffc107; margin-bottom: 10px;">تشغيل الشاشة الصوتية</h2>
            <p style="color: #cbd5e1; font-size: 0.9rem;">انقر للبدء وتفعيل النظام الصوتي وملء الشاشة</p>
            <button id="btnActivate" class="btn-activate">تفعيل وبدء النظام 🔊</button>
        </div>
    </div>

    <!-- واجهة الشاشة الكبرى -->
    <div id="displayScreen">
        <div class="top-header">
            <img src="https://github.com/blu2ris-create/clinic-queue-system/blob/main/logo.png%20(2).png?raw=true" alt="الشعار" class="cluster-logo">
        </div>
        <div class="content-grid">
            <div style="display: flex; flex-direction: column; height: 100%;">
                <div id="liveDateDisplay" style="text-align: center; color: #38bdf8; font-weight: bold; margin-bottom: 8px; background: #111827; padding: 8px; border-radius: 10px; border: 1px solid #1f2937;">--</div>
                <div class="sidebar">
                    <div class="archive-title">📋 آخر النداءات</div>
                    <div class="table-container">
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th>المراجع</th>
                                    <th>العيادة</th>
                                    <th>الوقت</th>
                                </tr>
                            </thead>
                            <tbody id="archiveTableBody">
                                <tr><td colspan="3" style="color: #94a3b8;">لا توجد نداءات</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="main-area">
                <div>
                    <h1 style="font-size: 2.5rem; font-weight: bold;">نداء المراجعين</h1>
                    <h3 style="color: #38bdf8;">مركز صحي الصالحية للرعاية الأولية</h3>
                </div>
                <div class="display-box">
                    <div id="mainPatient" class="display-number">--</div>
                    <div id="mainClinic" class="display-text">في انتظار النداء الأول...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="controlScreen">
        <div class="control-card">
            <h3 style="text-align: center; color: #ffc107; margin-bottom: 5px; font-size: 1.2rem;">لوحة التحكم</h3>
            <p style="text-align: center; color: #94a3b8; font-size: 0.8rem; margin-bottom: 1
